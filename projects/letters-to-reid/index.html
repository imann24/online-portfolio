        .set { padding-block: clamp(24px, 4vw, 48px) 0; }
        .back { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; margin-bottom: 28px; }
        .back svg { width: 18px; height: 18px; }
        .back:hover { text-decoration: underline; text-underline-offset: 3px; }
        .set-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 24px; }
        .set-icon { position: relative; padding: 14px; background: var(--paper); border: var(--keyline) solid var(--line); border-radius: var(--radius-box); }
        .set-icon img { width: 112px; height: 112px; border-radius: 14px; border: 2px solid var(--line); object-fit: cover; background: var(--white-1); }
        .set-icon .box-title { position: absolute; top: -12px; left: 12px; margin: 0; padding: 0 6px; background: var(--paper); }
        .set-head h1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }
        .set .lede { max-width: 48ch; margin-bottom: 28px; }
        .set-details { display: flex; flex-wrap: wrap; gap: 0; margin: 32px 0 0; padding: 0; background: var(--paper); border: var(--keyline) solid var(--line); border-radius: var(--radius-box); overflow: hidden; }
        .set-details div { flex: 1 1 170px; padding: 14px 18px; border-right: 2px solid var(--line-soft); border-bottom: 2px solid var(--line-soft); }
        .set-details dt { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
        .set-details dd { margin: 0; font-size: 16px; color: var(--ink-2); }
        .set-section { margin-top: 56px; }
        .built { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
        .built li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; align-items: start; padding: 14px 18px; background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius-box); color: var(--ink-2); }
        .built li::before { content: ""; width: 24px; height: 16px; margin-top: 4px; border: 2px solid var(--brick-line); border-radius: 3px; background: var(--set-era, var(--plate-1)); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18); }
        .set-section h2 { font-size: clamp(1.8rem, 3vw, 2.4rem); margin-bottom: 20px; }
        .frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .frame { display: block; padding: 10px; background: var(--paper); border: var(--keyline) solid var(--line); border-radius: var(--radius-box); cursor: zoom-in; transition: transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out); font: inherit; color: inherit; }
        .frame:hover { transform: translateY(-2px); box-shadow: var(--lift); }
        .frame img { width: 100%; border-radius: 4px; }
        .video { position: relative; aspect-ratio: 16 / 9; border: var(--keyline) solid var(--line); border-radius: var(--radius-box); overflow: hidden; background: #000; }
        .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .lightbox { max-width: min(1100px, 94vw); max-height: 92vh; padding: 10px; background: var(--paper); border: var(--keyline) solid var(--line); border-radius: var(--radius-box); }
        .lightbox::backdrop { background: rgba(8, 16, 28, 0.82); }
        .lightbox img { max-height: calc(92vh - 80px); width: auto; margin-inline: auto; border-radius: 4px; }
        .lightbox form { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        @media (max-width: 560px) {
            .set-head { grid-template-columns: 1fr; gap: 20px; }
            .set-icon { justify-self: start; }
            .set-icon img { width: 80px; height: 80px; }
        }

    </style>

<script>
    const EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16 16 8M9 8h7v7"/></svg>';
    const LINKS = [
        { key: 'Website', label: 'Website', primary: true },
        { key: 'PlayOnline', label: 'Play online', primary: true },
        { key: 'AppStore', label: 'App Store' },
        { key: 'GooglePlay', label: 'Google Play' },
        { key: 'itch.io', label: 'itch.io' },
        { key: 'GitHub', label: 'GitHub' },
        { key: 'Facebook', label: 'Facebook' },
        { key: 'Twitter', label: 'Twitter' },
    ];

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function slug() {
        const parts = location.pathname.replace(/\/$/, '').split('/');
        return parts[parts.length - 1];
    }
    function list(v) {
        if (!v) return null;
        if (Array.isArray(v)) { const f = v.filter(x => x && x !== 'N/A'); return f.length ? f.join(', ') : null; }
        return v === 'N/A' ? null : String(v);
    }
    function timeline(p) {
        if (!p.StartDate) return null;
        const f = d => new Date(d).toLocaleString('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' });
        const start = f(p.StartDate);
        if (p.IsOngoing) return `${start} – now`;
        if (p.EndDate) { const end = f(p.EndDate); return start === end ? start : `${start} – ${end}`; }
        return start;
    }

    function render(p) {
        document.title = `${p.Title} | Isaiah Mann`;
        const details = [
            ['Role', list(p.Roles)],
            ['Team', p.TeamSize ? (p.TeamSize === 1 ? 'Solo' : `${p.TeamSize} people`) : null],
            ['Organization', list(p.Organization)],
            ['Timeline', timeline(p)],
            ['Platforms', list(p.Platforms)],
            ['Languages', list(p.Languages)],
        ].filter(d => d[1]);
        const links = LINKS.map(l => ({ ...l, href: p[l.key] })).filter(l => l.href);
        const contributions = (p.Contributions || []).filter(Boolean);
        const pictures = p.Pictures || [];

        document.getElementById('content').innerHTML = `
            <div class="set-head">
                <div class="set-icon"><p class="box-title">1:1</p><img src="icon.png" alt="${esc(p.Title)} icon" width="112" height="112"></div>
                <h1>${esc(p.Title)}</h1>
            </div>
            ${p.Description ? `<p class="lede">${esc(p.Description)}</p>` : ''}
            ${links.length ? `<div class="btn-row">${links.map(l => `<a class="btn ${l.primary ? 'btn-primary' : 'btn-secondary'}" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ${EXT}</a>`).join('')}</div>` : ''}
            ${details.length ? `<dl class="set-details">${details.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
            ${contributions.length ? `<section class="set-section"><h2>What I built</h2><ul class="built">${contributions.map(c => `<li>${esc(c)}</li>`).join('')}</ul></section>` : ''}
            ${p.Video ? `<section class="set-section"><h2>Video</h2><div class="video"><iframe src="${esc(p.Video)}" title="${esc(p.Title)} video" loading="lazy" allowfullscreen></iframe></div></section>` : ''}
            ${pictures.length ? `<section class="set-section"><h2>Screenshots</h2><div class="frames">${pictures.map((src, i) => `<button class="frame" type="button" aria-label="Enlarge screenshot ${i + 1}"><img src="${esc(src)}" alt="${esc(p.Title)} screenshot ${i + 1}" loading="lazy"></button>`).join('')}</div></section>` : ''}
        `;
        const y = p.StartDate ? new Date(p.StartDate).getUTCFullYear() : null;
        const eraColor = y === null || y >= 2023 ? 'var(--red-1)' : y <= 2017 ? 'var(--yellow-1)' : 'var(--blue-1)';
        document.getElementById('content').style.setProperty('--set-era', eraColor);
        document.getElementById('status').hidden = true;
        document.getElementById('content').hidden = false;

        const lb = document.getElementById('lightbox');
        const lbImg = document.createElement('img');
        lb.append(lbImg);
        document.querySelectorAll('.frame').forEach(btn => btn.addEventListener('click', () => {
            const img = btn.querySelector('img');
            lbImg.src = img.src;
            lbImg.alt = img.alt;
            lb.showModal();
        }));
        lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
    }

    function fail(text) {
        const status = document.getElementById('status');
        status.querySelector('span').textContent = text;
    }

    fetch('/json/projects.json')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(data => {
            const p = (data.Projects || []).find(x => x.Key === slug());
            if (p) render(p);
            else fail("This set isn't in the catalogue. Head back to all projects.");
        })
        .catch(() => fail("Couldn't load this project. Check your connection and refresh."));
</script>
